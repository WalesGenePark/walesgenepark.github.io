site:
  name: Wales Gene Park
  site: 'https://walesgenepark.github.io'
  base: '/'
  trailingSlash: false
  logo:
    path: '/src/assets/images/wgp-logo.jpg'
    alt: 'Wales Gene Park Logo'

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Wales Gene Park
    template: '%s — Wales Gene Park'
  description: "Wales Gene Park is a leading organization in genomics research and education, supporting healthcare professionals, researchers, and the public in understanding and advancing genetic medicine."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Wales Gene Park
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@WalesGenePark'
    site: '@WalesGenePark'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
